[project]
name = "tableui-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pyyaml>=6",
  "pyotp>=2.9",
  "pyjwt>=2.9",
  "common-expression-language>=0.5",
  "phonenumbers>=8.13",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
  "boto3>=1.43.114",
  "python-multipart>=0.0.32",
  "openpyxl>=3.1.5",
  "pypdf>=6.21.1",
  "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "types-pyyaml",
  "testcontainers>=4.15.0",
  "moto>=5.2.4",
  "httpx>=0.28.1",
  "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableui"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["S101", "E501"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S311", "ASYNC230", "SIM115", "S101"]
"tools/**" = ["S311", "S101"]
# Record tables are named by metadata keys, which the model restricts to ^[a-z][a-z0-9_]{0,62}$;
# values always travel as bound parameters. The read side builds its SQL from those keys.
"src/tableui/query/application/records.py" = ["S608"]
"src/tableui/insights/application/engine.py" = ["S608"]
"src/tableui/insights/application/analytics.py" = ["S608"]
"src/tableui/matching/application/match.py" = ["S608"]
"src/tableui/imports/application/jobs.py" = ["S608"]
"src/tableui/rules/application/bulk.py" = ["S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["cel.*", "common_expression_language.*", "pyotp.*", "phonenumbers.*", "rapidfuzz.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.importlinter]
root_package = "tableui"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Shared kernel (platform) imports no module"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["tableui.platform"]
forbidden_modules = ["tableui.audit", "tableui.metadata", "tableui.tenancy", "tableui.identity", "tableui.rules", "tableui.commands", "tableui.query", "tableui.insights", "tableui.automation", "tableui.ops", "tableui.workspace", "tableui.catalog", "tableui.imports", "tableui.files", "tableui.search", "tableui.matching", "tableui.workflow", "tableui.approvals", "tableui.duplicates"]

[[tool.importlinter.contracts]]
name = "Module 'audit': only its public interface is importable from other modules"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["tableui.metadata", "tableui.tenancy", "tableui.identity", "tableui.rules", "tableui.commands", "tableui.query", "tableui.insights", "tableui.automation", "tableui.ops", "tableui.workspace", "tableui.catalog", "tableui.imports", "tableui.files", "tableui.search", "tableui.matching", "tableui.workflow", "tableui.approvals", "tableui.duplicates"]
forbidden_modules = ["tableui.audit.application", "tableui.audit.domain", "tableui.audit.adapters", "tableui.audit.api.router"]

[[tool.importlinter.contracts]]
name = "Module 'audit' layers: api > adapters > application > domain"
type = "layers"
layers = ["tableui.audit.api", "tableui.audit.adapters", "tableui.audit.application", "tableui.audit.domain"]

