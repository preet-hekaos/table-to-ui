- key: manager
  name: Manager
  description: Runs a team. Sees and edits everything, reads reports and the audit trail.
  grants: [metadata.read, "record.*.read", "record.*.create", "record.*.update", measure.read, audit.read, search.saved.manage, matching.configure, document.upload, ai.use, import.run, rule.override, approval.decide, "record.*.merge"]
- key: account_manager
  name: Account manager
  description: Looks after clients, their contacts and requirements.
  grants: ["record.*.read", "record.client.create", "record.client.update", "record.contact.create", "record.contact.update", "record.requirement.create", "record.requirement.update", "record.interaction.create", measure.read, ai.use]
- key: recruiter
  name: Recruiter
  description: Works candidates against requirements. Sees their own and their team's candidates.
  grants: ["record.*.read", "record.candidate.create", "record.candidate.update", "record.candidate_document.create", "record.submission.create", "record.submission.update", "record.interview.create", "record.interview.update", "record.offer.create", "record.offer.update", "record.placement.create", "record.placement.update", "record.interaction.create", "record.task.create", "record.task.update", "record.consent_record.create", measure.read, document.upload, ai.use]
  scopes: {candidate: own_team}
- key: sourcer
  name: Sourcer
  description: Finds and adds candidates. Does not see pay.
  grants: ["record.candidate.read", "record.candidate.create", "record.candidate_document.create", "record.skill.read", "record.requirement.read", document.upload]
  scopes: {candidate: own}
  field_deny: [candidate.current_ctc, candidate.expected_ctc]
- key: coordinator
  name: Coordinator
  description: Schedules and follows up. Does not see pay.
  grants: ["record.*.read", "record.interview.create", "record.interview.update", "record.task.create", "record.task.update", ai.use]
  field_deny: [candidate.current_ctc, candidate.expected_ctc]
- key: finance
  name: Finance
  description: Reads offers, placements and reports for billing.
  grants: ["record.client.read", "record.offer.read", "record.placement.*", measure.read]
- key: viewer
  name: Viewer
  description: Read-only access without pay.
  grants: ["record.*.read", measure.read]
  field_deny: [candidate.current_ctc, candidate.expected_ctc]
