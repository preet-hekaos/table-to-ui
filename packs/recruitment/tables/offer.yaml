key: offer
label: Offer
plural_label: Offers
title_field: summary
effects:
  - id: declined-returns-to-interview
    actions: [update]
    ref: submission
    when_changed: {status: Declined}
    set: {stage: Interview}
fields:
  - {key: summary, label: Summary, type: text, required: true, searchable: true}
  - {key: submission, label: Submission, type: reference, ref_table: submission, required: true, filterable: true}
  - {key: annual_ctc, label: Annual CTC, type: money, analytics: true}
  - {key: joining_on, label: Joining date, type: date}
  - {key: status, label: Status, type: select, required: true, default: Draft, options: [Draft, Sent, Accepted, Declined], filterable: true, analytics: true}
  - {key: sent_on, label: Sent on, type: date, analytics: true}
  - {key: decline_reason, label: Reason for declining, type: text}
