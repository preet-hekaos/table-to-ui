key: candidate
label: Candidate
plural_label: Candidates
title_field: full_name
groups:
  - key: profile
    label: Profile
  - key: pay
    label: Pay
  - key: identity
    label: Identity
  - key: contact
    label: Contact
  - key: employment
    label: Current employment
  - key: status
    label: Status
fields:
  - key: full_name
    label: Full name
    type: text
    searchable: true
    required: true
    group: identity
    normalize: text
    max_length: 200
  - key: email
    label: Email
    type: email
    searchable: true
    required: true
    group: contact
    normalize: email
    unique: true
  - key: phone
    label: Phone
    type: phone
    group: contact
    normalize: phone
    unique: true
  - key: current_title
    label: Current title
    type: text
    searchable: true
    group: employment
  - key: current_employer
    label: Current employer
    type: text
    searchable: true
    group: employment
    normalize: text
  - key: location
    label: Location
    type: text
    searchable: true
    filterable: true
    group: employment
  - key: notice_period_days
    label: Notice period (days)
    type: integer
    group: employment
    min: 0
    max: 365
  - key: status
    label: Status
    type: select
    group: status
    required: true
    default: Active
    options: [Active, Placed, Archived]
    analytics: true
    filterable: true
  - key: skills
    label: Skills
    type: tags
    group: profile
    searchable: true
    filterable: true
  - key: total_experience
    label: Total experience
    type: months
    group: profile
    filterable: true
  - key: source
    label: Source
    type: select
    group: profile
    options: [Referral, Job board, LinkedIn, Walk-in, Import, Other]
    filterable: true
  - key: current_ctc
    label: Current CTC
    type: money
    group: pay
  - key: expected_ctc
    label: Expected CTC
    type: money
    group: pay
    filterable: true
