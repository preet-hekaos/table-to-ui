id: R-10
title: A fee stays above the client's minimum
table: placement
applies_to: [create, update]
context:
  floor: {kind: lookup, ref_field: client, field: min_fee}
checks:
  - id: R-10.fee
    severity: approval
    editable: true
    when: "record.fee != null && ctx.floor != null && record.fee < ctx.floor"
    message: "The fee is below this client's minimum, so a manager has to approve it."
