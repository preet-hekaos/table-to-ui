# Local development stack (M0-S01). Start with `make up`.
name: table-to-ui
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tableui
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tableui"]
      interval: 3s
      timeout: 3s
      retries: 20
  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports: ["7233:7233", "8233:8233"]
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sqs,s3,kms,ses
    ports: ["4566:4566"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
  clamav:
    # Virus scanning for uploads (R-14). Optional locally: without CLAMD_HOST the API uses a
    # signature scanner that only knows the EICAR test file.
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
    profiles: ["scan"]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/tableui
      ENVIRONMENT: local
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    profiles: ["app"]
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    ports: ["5173:5173"]
    profiles: ["app"]
volumes:
  pgdata: {}
